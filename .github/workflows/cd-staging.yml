name: Frontend Staging CD

on:
  push:
    branches:
      - chore/Deployment
      - health
      - staging

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Load Frontend Environment Variables
        run: |
          # Source the frontend environment file
          if [ -f "/home/noov/inventum/staging/FE/.env" ]; then
            echo "Loading frontend environment variables..."
            source /home/noov/inventum/staging/FE/.env
            
            # Export them for use in subsequent steps
            echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_APP_ENV=$NEXT_PUBLIC_APP_ENV" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_APP_NAME=$NEXT_PUBLIC_APP_NAME" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_APP_VERSION=$NEXT_PUBLIC_APP_VERSION" >> $GITHUB_ENV
            echo "NEXT_PUBLIC_SENTRY_DSN=$NEXT_PUBLIC_SENTRY_DSN" >> $GITHUB_ENV
            
            echo "Frontend environment variables loaded"
          else
            echo "Frontend environment file not found!"
            exit 1
          fi
      
      - name: Build Frontend Docker Image
        run: |
          # Build the frontend image with environment variables as build args
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ env.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_APP_ENV="${{ env.NEXT_PUBLIC_APP_ENV }}" \
            --build-arg NEXT_PUBLIC_APP_NAME="${{ env.NEXT_PUBLIC_APP_NAME }}" \
            --build-arg NEXT_PUBLIC_APP_VERSION="${{ env.NEXT_PUBLIC_APP_VERSION }}" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ env.NEXT_PUBLIC_SENTRY_DSN }}" \
            --no-cache \
            -f Dockerfile \
            -t inventum-frontend:staging \
            .
          
          echo "Frontend Docker image built successfully"
      
      - name: Deploy Frontend
        working-directory: /home/noov/inventum/staging
        run: |
          # Stop and remove existing frontend container
          docker compose -f docker-compose.staging.yml stop frontend || true
          docker compose -f docker-compose.staging.yml rm -f frontend || true
          
          # Start the new frontend container
          docker compose -f docker-compose.staging.yml up -d frontend
          
          echo "Frontend container deployed"
      
      - name: Verify Deployment
        run: |
          # Wait for container to start
          sleep 15
          
          # Check container status
          docker ps | grep frontend
          
          # Verify environment variables in container
          echo "Environment variables in container:"
          docker exec inventum-frontend-staging printenv | grep NEXT_PUBLIC || echo "No NEXT_PUBLIC vars found"
          
          # Test frontend accessibility
          echo "Testing frontend accessibility:"
          curl -I http://localhost:3000/ || echo "Frontend starting up..."
          
          # Test external access
          echo "Testing external access:"
          curl -I https://fe.al3l.com/ || echo "External access not ready yet"
      
      - name: Reconnect Monitoring Network
        run: |
          # Reconnect monitoring services to the inventum network
          docker network connect inventum-network prometheus 2>/dev/null || true
          docker network connect inventum-network grafana 2>/dev/null || true
          
          echo "Monitoring network reconnected"
      
      - name: Deployment Summary
        run: |
          echo "Frontend Deployment Complete"
          echo "==============================="
          echo "Frontend built with environment variables from FE/.env"
          echo "Docker image: inventum-frontend:staging"
          echo "Container: inventum-frontend-staging"
          echo "Internal URL: http://localhost:3000"
          echo "External URL: https://fe.al3l.com"
          echo "API URL: ${{ env.NEXT_PUBLIC_API_URL }}"
          echo "==============================="